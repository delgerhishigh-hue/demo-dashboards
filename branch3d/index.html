<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Салбарын багц 3D (демо)</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%2317263D'/%3E%3Cpath d='M9 24V15M16 24V8M23 24V12' stroke='%2338BDF8' stroke-width='3.2' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="vendor/maplibre-gl.css">
<style>
:root{
  --bg:#070d19; --glass:rgba(12,22,40,.74); --glass2:rgba(18,32,56,.86); --line:rgba(140,180,230,.16); --line2:rgba(140,180,230,.28);
  --t1:#f3f6fb; --t2:#b9c6d8; --t3:#7f8ea3; --acc:#38bdf8; --acc2:#7dd3fc;
  --good:#0ca30c; --warn:#fab219; --ser:#ec835a; --crit:#d03b3b;
  --s1:#3987e5; --grid:rgba(160,190,230,.12);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--t1);font:13px/1.4 "Inter","Segoe UI",system-ui,sans-serif;overflow:hidden}
button,input{font:inherit;color:inherit}
#map{position:absolute;inset:0}
.vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 55%,rgba(3,7,15,.55) 100%)}
.glass{background:var(--glass);backdrop-filter:blur(14px) saturate(1.3);-webkit-backdrop-filter:blur(14px) saturate(1.3);border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 40px rgba(0,0,0,.35)}
.maplibregl-ctrl-attrib{background:rgba(7,13,25,.6)!important;color:var(--t3)!important;font-size:10px}
.maplibregl-ctrl-attrib a{color:var(--t2)!important}
.maplibregl-ctrl-bottom-right{bottom:0}

/* top bar */
.top{position:absolute;top:12px;left:12px;right:12px;display:flex;gap:10px;align-items:center;padding:8px 10px;z-index:5;flex-wrap:wrap}
.brand{display:flex;gap:9px;align-items:center;cursor:pointer;padding-right:6px;border:0;background:none}
.brand svg{width:30px;height:30px;flex:none}
.brand b{display:block;font-size:14px;letter-spacing:.2px}
.brand em{display:block;font-style:normal;color:var(--t3);font-size:11px}
.search{position:relative;flex:1 1 130px;max-width:300px}
@media (max-width:1650px) and (min-width:901px){.grp>span{display:none}.brand em{max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}}
.search input{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:10px;padding:7px 10px;outline:none}
.search input:focus{border-color:var(--acc)}
.results{position:absolute;top:110%;left:0;right:0;max-height:300px;overflow:auto;padding:4px;z-index:20}
.results button{display:flex;justify-content:space-between;width:100%;text-align:left;background:none;border:0;padding:7px 9px;border-radius:8px;cursor:pointer;gap:8px}
.results button:hover,.results button.on{background:rgba(56,189,248,.14)}
.results small{color:var(--t3)}
.seg{display:inline-flex;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:10px;padding:2px}
.seg button{background:none;border:0;padding:5px 10px;border-radius:8px;cursor:pointer;color:var(--t2);white-space:nowrap}
.seg button.on{background:rgba(56,189,248,.18);color:var(--t1);box-shadow:inset 0 0 0 1px rgba(56,189,248,.45)}
.seg button:hover:not(.on){color:var(--t1)}
.grp{display:flex;align-items:center;gap:6px}
.grp>span{color:var(--t3);font-size:11px}
.sp{flex:1}
.ib{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:10px;width:34px;height:32px;cursor:pointer;display:inline-grid;place-items:center;color:var(--t2)}
.ib:hover{color:var(--t1);border-color:var(--line2)}
.ib.on{color:var(--acc);border-color:rgba(56,189,248,.5)}
.asof{color:var(--t3);font-size:11px;white-space:nowrap}
.demo{flex:none;font-size:11px;font-weight:600;letter-spacing:.3px;color:#1a1204;background:#fab219;border-radius:20px;padding:3px 10px;white-space:nowrap}
/* HTML шошго (glyph татахгүй) */
.lbls{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:1;transition:opacity .4s}
.mlb{position:absolute;left:0;top:0;white-space:nowrap;text-align:center;color:#eaf3ff;font-size:11.5px;line-height:1.2;text-shadow:0 0 3px rgba(5,10,20,.95),0 0 2px rgba(5,10,20,.95),0 1px 2px #050a14;will-change:transform}
.mlb small{display:block;font-size:10px;color:#c9d8ea}
.mlb.det{font-size:12px}

/* left list */
.list{position:absolute;left:12px;top:var(--th,78px);bottom:132px;width:290px;display:flex;flex-direction:column;z-index:4;transition:transform .35s ease}
.list.hide{transform:translateX(-310px)}
.lh{display:flex;justify-content:space-between;align-items:center;padding:10px 12px 6px}
.lh b{font-size:12px;letter-spacing:.4px;color:var(--t2);text-transform:uppercase}
.lh select{background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--t2);border-radius:8px;padding:3px 6px;font-size:11px}
.lh select option{background:#0c1628}
.rows{overflow:auto;padding:2px 6px 8px;flex:1}
.row{display:grid;grid-template-columns:18px 1fr auto;gap:2px 8px;align-items:center;padding:6px 7px;border-radius:9px;cursor:pointer;border:1px solid transparent}
.row:hover{background:rgba(255,255,255,.05)}
.row.on{background:rgba(56,189,248,.12);border-color:rgba(56,189,248,.35)}
.row i{width:10px;height:10px;border-radius:3px;display:block}
.row .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .v{color:var(--t2);font-variant-numeric:tabular-nums;font-size:12px}
.row .bar{grid-column:2/4;height:3px;background:rgba(255,255,255,.06);border-radius:2px;overflow:hidden}
.row .bar u{display:block;height:100%;background:var(--s1);border-radius:2px;transition:width .6s ease}
.row.nl .nm{color:var(--t3)}
.lsub{padding:8px 10px 2px;color:var(--t3);font-size:11px}
.ltog{position:absolute;left:12px;top:var(--th,78px);z-index:3}

/* bottom dock */
.dock{position:absolute;left:12px;right:12px;bottom:22px;display:flex;gap:10px;align-items:flex-end;z-index:4;pointer-events:none}
.dock>*{pointer-events:auto}
.kpis{display:flex;gap:0;padding:8px 6px}
.kpi{padding:2px 14px;border-right:1px solid var(--line);min-width:118px}
.kpi:last-child{border-right:0}
.kpi span{display:block;color:var(--t3);font-size:11px}
.kpi b{display:block;font-size:19px;font-variant-numeric:tabular-nums;letter-spacing:-.2px}
.kpi small{color:var(--t2);font-size:11px}
.legend{padding:9px 12px}
.legend .lt{color:var(--t3);font-size:11px;margin-bottom:5px}
.legend .li{display:flex;gap:7px;align-items:center;font-size:12px;color:var(--t2);margin:2px 0}
.legend .li i{width:12px;height:12px;border-radius:3px}
.legend .note{color:var(--t3);font-size:11px;margin-top:5px;max-width:200px}

/* right panel */
.panel{position:absolute;top:var(--th,78px);right:12px;bottom:22px;width:420px;z-index:6;display:flex;flex-direction:column;transform:translateX(450px);opacity:0;transition:transform .45s cubic-bezier(.2,.8,.2,1),opacity .35s}
.panel.open{transform:none;opacity:1}
.ph{padding:14px 16px 10px;border-bottom:1px solid var(--line);position:relative}
.ph .g{color:var(--acc2);font-size:11px;letter-spacing:.5px;text-transform:uppercase}
.ph h2{margin:2px 0 4px;font-size:20px;letter-spacing:-.2px;padding-right:80px}
.ph .meta{color:var(--t3);font-size:12px}
.ph .nav{position:absolute;top:12px;right:12px;display:flex;gap:6px}
.pb{overflow:auto;padding:12px 16px 18px;flex:1}
.tiles{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.tile{background:rgba(255,255,255,.035);border:1px solid var(--line);border-radius:11px;padding:9px 10px;opacity:0;transform:translateY(8px);animation:up .5s forwards}
.tile span{display:block;color:var(--t3);font-size:11px}
.tile b{display:block;font-size:15.5px;white-space:nowrap;margin-top:1px;font-variant-numeric:tabular-nums}
.tile small{display:block;font-size:11px;color:var(--t2);margin-top:1px}
.tile.big{grid-column:span 2}
.tile.big b{font-size:24px}
@keyframes up{to{opacity:1;transform:none}}
.sec{margin-top:16px;opacity:0;animation:up .55s forwards}
.sec h3{margin:0 0 7px;font-size:12px;color:var(--t2);font-weight:600;letter-spacing:.3px;display:flex;justify-content:space-between;align-items:baseline}
.sec h3 small{font-weight:400;color:var(--t3)}
.st{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:1px 7px;border-radius:20px;border:1px solid}
.up{color:#86b6ef}.dn{color:#f0a5a5}
.stack{display:flex;height:16px;border-radius:5px;overflow:hidden;gap:2px;background:transparent}
.stack i{display:block;height:100%;width:0;transition:width .9s cubic-bezier(.2,.8,.2,1)}
table.bk{width:100%;border-collapse:collapse;margin-top:8px;font-variant-numeric:tabular-nums}
table.bk td,table.bk th{padding:4px 4px;text-align:right;font-size:12px;border-bottom:1px solid var(--line)}
table.bk th{color:var(--t3);font-weight:500;font-size:11px}
table.bk td:first-child,table.bk th:first-child{text-align:left}
table.bk td:first-child i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px}
table.bk tr.npl td{color:#f3b0a8}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{fill:var(--t3);font-size:10px}
.chart .lab{fill:var(--t1);font-size:10.5px;font-weight:600}
.pr{display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding:5px 0;border-bottom:1px solid var(--line)}
.pr .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr .n small{color:var(--t3);margin-left:5px}
.pr .v{font-variant-numeric:tabular-nums;color:var(--t2);font-size:12px;text-align:right}
.pr .b{grid-column:1/3;height:4px;background:rgba(255,255,255,.05);border-radius:2px;overflow:hidden}
.pr .b u{display:block;height:100%;width:0;background:var(--s1);border-radius:2px;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.cmp{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:6px}
.cmp div{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:9px;padding:6px 8px}
.cmp span{display:block;font-size:10.5px;color:var(--t3)}
.cmp b{font-variant-numeric:tabular-nums}
.foot{color:var(--t3);font-size:11px;margin-top:16px;line-height:1.5}

/* tooltips */
.tip{position:absolute;z-index:30;pointer-events:none;padding:8px 10px;font-size:12px;max-width:260px;transform:translate(12px,12px)}
.tip b{display:block;font-size:13px;margin-bottom:2px}
.tip .r{display:flex;justify-content:space-between;gap:14px;color:var(--t2)}
.tip .r em{font-style:normal;color:var(--t1);font-variant-numeric:tabular-nums}

/* loader */
.loader{position:absolute;inset:0;display:grid;place-items:center;background:var(--bg);z-index:50;transition:opacity .8s}
.loader.done{opacity:0;pointer-events:none}
.lc{text-align:center;color:var(--t2)}
.lc svg{width:54px;height:54px;animation:pulse 1.6s infinite}
.lc b{display:block;color:var(--t1);font-size:16px;margin:10px 0 4px}
@keyframes pulse{50%{transform:scale(1.08);filter:drop-shadow(0 0 12px #38bdf8)}}

/* 3D тавцан (diorama.js) */
#holo{position:absolute;left:0;top:0;width:780px;height:480px;z-index:3;pointer-events:none;opacity:0;transition:opacity .45s}
#holo.on{opacity:1}
#holo canvas{width:780px;height:480px;display:block;filter:drop-shadow(0 18px 30px rgba(0,0,0,.55))}
#holo .hl{position:absolute;inset:0}
.hlab{position:absolute;left:0;top:0;width:max-content;white-space:nowrap;font-size:11px;padding:3px 7px;border-radius:8px;background:rgba(9,18,34,.82);border:1px solid var(--line2);color:var(--t2);transition:opacity .4s;backdrop-filter:blur(6px)}
.hlab b{color:var(--t1);margin-left:3px}
.hlab i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:0}
.hlab.title{z-index:2;font-size:13px;padding:4px 10px;border-color:rgba(56,189,248,.55);color:var(--acc2)}
.hlab.tower{font-size:10px;padding:2px 6px;display:flex;flex-direction:column;align-items:center;line-height:1.2}
.hlab.tower b{margin:0}
.hlab.sat{display:flex;flex-direction:column;align-items:flex-start;line-height:1.25;border-color:rgba(255,255,255,.25)}
.hlab.stf{display:flex;gap:12px;font-size:11.5px;padding:5px 11px}
.hlab.stf .sg{white-space:nowrap}
.hlab.sat span{font-size:10.5px}
.hlab.drop{color:#ffb4b4;border-color:rgba(255,91,91,.5)}
.hlab.loop{color:var(--acc2);border-color:rgba(125,211,252,.5)}
/* ажилчид, хариуцлага, кейс */
.staff{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.staff div{background:rgba(255,255,255,.035);border:1px solid var(--line);border-radius:10px;padding:7px 8px;text-align:center}
.staff i{display:block;width:16px;height:16px;border-radius:50%;margin:0 auto 3px;box-shadow:0 0 0 3px rgba(255,255,255,.05)}
.staff b{display:block;font-size:18px;font-variant-numeric:tabular-nums}
.staff span{font-size:10.5px;color:var(--t3)}
.note{font-size:11.5px;color:var(--t2);background:rgba(56,189,248,.07);border:1px solid rgba(56,189,248,.22);border-radius:9px;padding:7px 9px;margin:6px 0 8px;line-height:1.45}
table.mv{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
table.mv td,table.mv th{white-space:nowrap;padding:4px 3px;font-size:12px;text-align:right;border-bottom:1px solid var(--line)}
table.mv th{color:var(--t3);font-weight:500;font-size:11px}
table.mv td:first-child,table.mv th:first-child{text-align:left;white-space:normal}
table.mv td small{display:block;color:var(--t3);font-size:10.5px}
.rg{margin-top:8px}
.rg .rh{display:flex;justify-content:space-between;align-items:center;padding:6px 0 3px;font-weight:600}
.rg .rh i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.rg .rh small{font-weight:400;color:var(--t2);font-variant-numeric:tabular-nums}
.rg .tm{display:grid;grid-template-columns:1fr auto auto;gap:8px;padding:3px 0 3px 16px;font-size:12px;color:var(--t2);font-variant-numeric:tabular-nums;border-bottom:1px dashed var(--line)}
.rg .tm em{font-style:normal;color:var(--t3);font-size:11px}
.case{display:grid;grid-template-columns:auto 1fr auto;gap:2px 8px;padding:6px 0;border-bottom:1px solid var(--line);align-items:center}
.case .ty{font-size:10.5px;padding:1px 6px;border-radius:10px;border:1px solid;white-space:nowrap}
.case .pn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px}
.case .pn small{color:var(--t3);margin-left:4px}
.case .am{text-align:right;font-variant-numeric:tabular-nums;font-size:12px}
.case .am small{display:block;color:var(--t3);font-size:10.5px}
.hubrow .nm{color:var(--acc2)}

@media (max-width:900px){
  #holo{display:none}
  .list{display:none}.ltog{display:none}
  .panel{left:8px;right:8px;width:auto;top:auto;height:62vh;bottom:8px;transform:translateY(70vh)}
  .top{top:8px;left:8px;right:8px}
  .kpi{min-width:90px;padding:2px 9px}.kpi b{font-size:15px}
  .legend{display:none}
  .dock{left:8px;right:8px;bottom:18px}
  .kpis{max-width:100%;overflow-x:auto;scrollbar-width:none}
  .kpi{flex:none}
}
@media (max-width:600px){
  .top{gap:6px;padding:6px 8px}
  .grp>span,.brand em{display:none}
  .search{flex:1 1 100%;max-width:none;order:5}
  .seg button{padding:4px 7px;font-size:12px}
  .brand svg{width:26px;height:26px}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
</style>
</head>
<body>
<div id="map" aria-label="Салбаруудын 3D газрын зураг"></div>
<div class="vignette" aria-hidden="true"></div>

<header class="top glass">
  <button class="brand" id="home" type="button" title="Нийт багц, анхны харагдац">
    <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#17263D"/><path d="M9 24V15M16 24V8M23 24V12" stroke="#38BDF8" stroke-width="3.2" fill="none" stroke-linecap="round"/></svg>
    <span><b>Салбарын багц · 3D</b><em id="asof"></em></span>
  </button>
  <span class="demo" title="Энэ хуудасны бүх нэр, тоо зохиомол — бодит байгууллагын өгөгдөл биш">ДЕМО · зохиомол өгөгдөл</span>
  <div class="search" role="search">
    <input id="q" type="search" autocomplete="off" spellcheck="false" placeholder="Салбар хайх…  ( / )" aria-label="Салбар хайх">
    <div id="results" class="results glass" hidden></div>
  </div>
  <div class="grp"><span>Сегмент</span><div class="seg" id="segF"></div></div>
  <div class="grp"><span>Өндөр</span><div class="seg" id="hF"></div></div>
  <div class="grp"><span>Өнгө</span><div class="seg" id="cF"></div></div>
  <div class="sp"></div>
  <button class="ib on" id="orbit" type="button" title="Камерын эргэлт (Space)">⟳</button>
  <button class="ib" id="satB" type="button" title="Хиймэл дагуул / бараан суурь">◐</button>
</header>

<aside class="list glass" id="list">
  <div class="lh"><b>Салбарууд</b><select id="sortS" aria-label="Эрэмбэ"></select></div>
  <div class="rows" id="rows"></div>
</aside>

<aside class="panel glass" id="panel" aria-live="polite">
  <div class="ph">
    <div class="g" id="pg"></div>
    <h2 id="pt"></h2>
    <div class="meta" id="pm"></div>
    <div class="nav">
      <button class="ib" id="prevB" type="button" title="Өмнөх (←)">‹</button>
      <button class="ib" id="nextB" type="button" title="Дараах (→)">›</button>
      <button class="ib" id="closeB" type="button" title="Хаах (Esc)">✕</button>
    </div>
  </div>
  <div class="pb" id="pb"></div>
</aside>

<footer class="dock">
  <div class="kpis glass" id="kpis"></div>
  <div class="legend glass" id="legend"></div>
</footer>

<div class="tip glass" id="tip" hidden></div>
<div class="loader" id="loader"><div class="lc"><svg viewBox="0 0 32 32"><path d="M9 24V15M16 24V8M23 24V12" stroke="#38BDF8" stroke-width="2.6" fill="none" stroke-linecap="round"/></svg><b>Салбарын багц · 3D (демо)</b><span id="lmsg">Ачаалж байна…</span></div></div>

<script src="vendor/maplibre-gl.js"></script>
<script src="geo.js"></script>
<script src="data.js"></script>
<script type="module" src="diorama.js"></script>
<script>
(function () {
'use strict';
const BP = window.BP, GEO = window.GEO, ML = window.maplibregl;
if (!ML) { document.getElementById('lmsg').textContent = 'Газрын зургийн сан (MapLibre) ачаалагдсангүй.'; return; }
const $ = s => document.querySelector(s);
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
// толгойн мөр мөр шилжвэл (badge нэмэгдсэн) жагсаалт/самбарыг доош нь түлхэнэ
const setTop = () => { const t = document.querySelector('.top'); document.documentElement.style.setProperty('--th', (t.offsetTop + t.offsetHeight + 8) + 'px'); };
setTop(); addEventListener('resize', setTop);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// ── формат
const sp = s => s.replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
const fN = v => v == null || !isFinite(v) ? '—' : sp(Math.round(v).toString());
const fB = v => (v / 1e9).toFixed(Math.abs(v) >= 100e9 ? 0 : 1);                       // тэрбум
const fM = v => {                                                                    // ₮ автомат нэгж
  const a = Math.abs(v);
  if (a >= 1e9) return (v / 1e9).toFixed(a >= 100e9 ? 0 : 1) + ' тэрбум ₮';
  if (a >= 1e6) return (v / 1e6).toFixed(a >= 100e6 ? 0 : 1) + ' сая ₮';

const q = $('#q'), res = $('#results');
let hits = [], hi = 0;
function search() {
  const s = q.value.trim().toLowerCase();
  if (!s) { res.hidden = true; return; }
  hits = ALL.filter(e => e.short.toLowerCase().includes(s) || e.name.toLowerCase().includes(s) || String(e.no).includes(s)).slice(0, 10); hi = 0;
  res.innerHTML = hits.length ? hits.map((e, i) => `<button type="button" class="${i === hi ? 'on' : ''}" data-i="${i}"><span>${esc(e.short)}</span><small>${fB(e.bal)} тэр · NPL ${fP(e.nplP)}</small></button>`).join('') : '<div style="padding:8px;color:var(--t3)">Олдсонгүй</div>';
  res.hidden = false;
}
q.addEventListener('input', search);
q.addEventListener('keydown', ev => {
  if (ev.key === 'ArrowDown' || ev.key === 'ArrowUp') { hi = (hi + (ev.key === 'ArrowDown' ? 1 : -1) + hits.length) % Math.max(1, hits.length); res.querySelectorAll('button').forEach((b, i) => b.classList.toggle('on', i === hi)); ev.preventDefault(); }
  if (ev.key === 'Enter' && hits[hi]) { select(hits[hi], true); q.value = ''; res.hidden = true; q.blur(); }
  if (ev.key === 'Escape') { q.value = ''; res.hidden = true; q.blur(); }
  ev.stopPropagation();
});
res.addEventListener('click', ev => { const b = ev.target.closest('button'); if (b) { select(hits[+b.dataset.i], true); q.value = ''; res.hidden = true; } });
addEventListener('keydown', ev => {
  if (ev.target.tagName === 'INPUT' || ev.target.tagName === 'SELECT') return;
  if (ev.key === '/') { q.focus(); ev.preventDefault(); }
  else if (ev.key === 'Escape') select(null);
  else if (ev.key === 'ArrowRight' && S.sel != null) step(1);
  else if (ev.key === 'ArrowLeft' && S.sel != null) step(-1);
  else if (ev.key === ' ') { $('#orbit').click(); ev.preventDefault(); }
  else if (ev.key === 'r' || ev.key === 'R') home();
});

setTimeout(() => { if (!started && map.style && map.style._loaded) { S.noDem = S.noDem || TERR.dem + TERR.demH > 0; start(); } }, 5000);
map.on('load', () => start());
const intro = () => map.flyTo({ center: [103.2, 46.4], zoom: innerWidth < 700 ? 3.6 : 4.75, pitch: 52, bearing: -12, duration: RM ? 0 : 3400, curve: 1.3, essential: true });
function start() {
  if (started) return; started = true;
  addLayers(); setSat(true);
  $('#loader').classList.add('done');
  renderList(); renderKpis(); renderLegend();
  requestAnimationFrame(loop);
  intro();
  // watchdog: tile алдаанаас болж эхлэлийн нислэг тасарвал (камер эхний байрлалдаа) дахин нисгэнэ
  let wd = 0; const wdT = setInterval(() => { if (++wd > 15 || S.sel != null) return clearInterval(wdT); if (!map.isMoving() && map.getZoom() < 3) intro(); }, 1000);
  setTimeout(() => { refresh(true); S.ready = true; }, RM ? 0 : 1500);
  window.__bp3d = { map, S, ALL, select };
}
setTimeout(() => { if (!$('#loader').classList.contains('done')) $('#lmsg').textContent = 'Газрын зураг ачаалагдсангүй — Chrome/Edge-ийн сүүлийн хувилбараар (WebGL2) нээнэ үү.'; }, 15000);
})();
</script>
